name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: polpo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      # Corepack ships with Node 22 and respects `packageManager` in
      # package.json — avoids the pnpm/action-setup action which
      # intermittently 404s on codeload.github.com (2026-05-26).
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Run tests
        run: pnpm run test run
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/polpo_test

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6
      # Corepack ships with Node 22 and respects `packageManager` in
      # package.json — avoids the pnpm/action-setup action which
      # intermittently 404s on codeload.github.com (2026-05-26).
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      - name: Publish @polpo-ai/core
        run: pnpm --filter @polpo-ai/core publish --no-git-checks --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @polpo-ai/vault-crypto
        run: pnpm --filter @polpo-ai/vault-crypto publish --no-git-checks --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @polpo-ai/drizzle
        run: pnpm --filter @polpo-ai/drizzle publish --no-git-checks --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @polpo-ai/llm
        run: pnpm --filter @polpo-ai/llm publish --no-git-checks --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @polpo-ai/tools
        run: pnpm --filter @polpo-ai/tools publish --no-git-checks --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @polpo-ai/server
        run: pnpm --filter @polpo-ai/server publish --no-git-checks --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @polpo-ai/sdk
        run: pnpm --filter @polpo-ai/sdk publish --no-git-checks --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @polpo-ai/react
        run: pnpm --filter @polpo-ai/react publish --no-git-checks --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @polpo-ai/cli
        run: pnpm --filter @polpo-ai/cli publish --no-git-checks --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish polpo-ai
        run: pnpm publish --no-git-checks --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    # Wait for npm publish so the Dockerfile's `npm install polpo-ai@${VERSION}`
    # actually finds the packages. Until this dependency was added, docker
    # raced npm publish and intermittently failed with ETARGET.
    needs: [publish]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/runner/Dockerfile
          push: true
          # Daytona sandboxes are x86_64-only — building arm64 burns ~10
          # minutes and then fails on `mount-s3.deb` (hardcoded to
          # /x86_64/ path inside the Dockerfile). Until we switch to a
          # TARGETARCH-aware install or add aarch64 binary URLs, build
          # amd64 only.
          platforms: linux/amd64
          # POLPO_VERSION drives `npm install polpo-ai@${POLPO_VERSION}` inside
          # the Dockerfile. Without this build-arg the Dockerfile fell back to
          # its hardcoded `ARG POLPO_VERSION=0.7.0` and every image we ever
          # pushed (regardless of tag) contained polpo-ai@0.7.0. That's why the
          # Daytona sandbox runtime stayed pinned to 0.7.0 even after months of
          # npm releases.
          build-args: |
            POLPO_VERSION=${{ steps.version.outputs.VERSION }}
          # Image name aligned with what the cloud snapshot script pulls
          # (`ghcr.io/lumea-labs/polpo-runner:<v>`). Before this change the
          # workflow published as `ghcr.io/lumea-labs/polpo:<v>` — different
          # package — so the cloud either 404'd or pulled some manually-
          # published copy that never got refreshed.
          tags: |
            ghcr.io/${{ github.repository_owner }}/polpo-runner:latest
            ghcr.io/${{ github.repository_owner }}/polpo-runner:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-notes:
    name: Release Notes
    runs-on: ubuntu-latest
    needs: [publish]
    if: always() && needs.publish.result == 'success'
    steps:
      - uses: actions/checkout@v6
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
