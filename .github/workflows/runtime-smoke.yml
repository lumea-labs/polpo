name: Runtime Smoke

# Layer-2 tests for @polpo-ai/tools — they need the real runtime
# binaries (Chromium, Playwright, edge-tts, mountpoint-s3, polpo-ai
# npm) which Layer-1 vitest tests mock. We run them inside the
# canonical runner image so this same workflow doubles as the
# publish pipeline for ghcr.io/lumea-labs/polpo-runner.
#
# Per-PR        → build + smoke (no push)
# Push to main  → build + smoke + push :main, :latest
# Tag v*        → build + smoke + push :<version>, :latest
# Manual run    → build + smoke (workflow_dispatch for debug)
# Nightly       → smoke against the published :latest image (catches
#                 transitive-dep / npm-published regressions even if
#                 nobody opened a PR that day)

on:
  push:
    branches: [main]
    # Tag pushes are handled via `workflow_run` below — they MUST
    # wait for `release.yml` to publish to npm first, otherwise the
    # Dockerfile's `npm install polpo-ai@<version>` races against an
    # unpublished version and fails. Triggering directly on tag would
    # reintroduce that race.
  pull_request:
    paths:
      - "docker/runner/**"
      - ".github/workflows/runtime-smoke.yml"
      - "packages/tools/**"
  # Chain after a successful Release run so npm has the new version
  # by the time we try to install it inside the image.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/lumea-labs/polpo-runner

jobs:
  # ─── Build + smoke against the current branch's Dockerfile ───
  # Skipped for the nightly schedule trigger — that path runs the
  # published image instead, see `nightly-published` below.
  build-and-smoke:
    name: Build runner image + Layer-2 smoke
    # Skip the cron schedule (handled by the dedicated nightly job
    # below). Skip workflow_run firings that didn't come from a
    # successful Release (we only want to rebuild after a tag-driven
    # release succeeds, not after random Release retries).
    if: |
      github.event_name != 'schedule' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_branch, 'v')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          # When triggered by workflow_run, default $GITHUB_SHA is the
          # commit on the default branch — but we want the tagged
          # commit that the Release ran against, so the Dockerfile
          # picks up the right packages/core/package.json version.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Buildx is needed for cache-from/cache-to type=gha.
      - uses: docker/setup-buildx-action@v3

      # `polpo_version` is the npm package version the Dockerfile
      # installs INSIDE the image — must always be a published, real
      # version. We read it from packages/core/package.json (at the
      # checked-out commit) so it tracks whatever the trigger ref is.
      #
      # `image_tag` is the Docker tag we attach to the built image
      # (separate concern from the npm version). On workflow_run after
      # a Release we use the tag that Release ran against; on main
      # push we use `main`; on PR we use `pr-N`.
      - name: Compute build inputs
        id: ver
        run: |
          POLPO_VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "polpo_version=$POLPO_VERSION" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            # workflow_run.head_branch is the tag name (e.g. "v0.7.1")
            # because Release was triggered by `tags: ["v*"]`.
            HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
            echo "image_tag=${HEAD_BRANCH#v}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            echo "image_tag=main" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=pr-${{ github.event.pull_request.number || 'manual' }}" >> "$GITHUB_OUTPUT"
          fi

      # PR-bump race guard: when a PR bumps the version (the standard
      # release-prep flow), one or more packages installed by the runner can
      # still be unpublished. Checking only core is insufficient when a
      # partial release exists: Docker would then fail on the next package.
      #
      # Symmetric to the tag-push race that #57 already fixed via
      # `workflow_run`. Here we detect "version not on npm yet" and skip
      # the build cleanly — the post-merge `workflow_run` (chained off
      # Release) will exercise the same Dockerfile against the now-published
      # version, so coverage isn't lost.
      - name: Check version is published on npm
        id: published
        if: github.event_name == 'pull_request'
        run: |
          V="${{ steps.ver.outputs.polpo_version }}"
          MISSING=()
          for PACKAGE in polpo-ai @polpo-ai/core @polpo-ai/drizzle @polpo-ai/tools; do
            if ! npm view "$PACKAGE@$V" version >/dev/null 2>&1; then
              MISSING+=("$PACKAGE@$V")
            fi
          done

          if [[ ${#MISSING[@]} -eq 0 ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Runner dependencies not on npm yet (${MISSING[*]}) — skipping PR-time build (will run post-merge via Release → workflow_run)."
          fi

      # Build the image but DON'T push yet — we want smoke to pass first.
      # `load: true` puts the image into the local Docker daemon so we
      # can `docker run` it in the next step.
      - name: Build image
        id: build
        if: github.event_name != 'pull_request' || steps.published.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: docker/runner
          file: docker/runner/Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.image_tag }}
          build-args: |
            POLPO_VERSION=${{ steps.ver.outputs.polpo_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Layer-2 smoke tests
        if: github.event_name != 'pull_request' || steps.published.outputs.available == 'true'
        run: |
          docker run --rm \
            -v "$PWD/docker/runner/tests:/tests:ro" \
            -w /home/daytona \
            ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.image_tag }} \
            node /tests/runtime-smoke.mjs

      # Push only happens after smoke is green AND we're on main/tag.
      - name: Login to GHCR
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR (main / tag only)
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
        uses: docker/build-push-action@v6
        with:
          context: docker/runner
          file: docker/runner/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            POLPO_VERSION=${{ steps.ver.outputs.polpo_version }}
          cache-from: type=gha

  # ─── Nightly: pull whatever is published on :latest and re-run
  # the smoke tests against it. This catches regressions that come
  # from outside the repo — e.g. a transitive dep upgrade in
  # @polpo-ai/tools' optionalDependencies pulled in at build time —
  # without us having to push anything new.
  nightly-published:
    name: Nightly smoke against published :latest
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: docker/runner/tests

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image
        run: docker pull ${{ env.IMAGE_NAME }}:latest

      - name: Run Layer-2 smoke tests
        run: |
          docker run --rm \
            -v "$PWD/docker/runner/tests:/tests:ro" \
            -w /home/daytona \
            ${{ env.IMAGE_NAME }}:latest \
            node /tests/runtime-smoke.mjs
