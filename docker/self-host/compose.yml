name: polpo-self-host-e2e

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: polpo
      POSTGRES_USER: polpo
      POSTGRES_PASSWORD: polpo-e2e-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polpo -d polpo"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [polpo]

  mock-llm:
    image: node:22-alpine
    working_dir: /mock
    command: ["node", "mock-llm.mjs"]
    volumes:
      - ./mock-llm.mjs:/mock/mock-llm.mjs:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4010/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [polpo]

  runtime:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://polpo:polpo-e2e-password@postgres:5432/polpo
      POLPO_MODEL: mock/e2e-model
      POLPO_API_KEY: polpo-e2e-secret
    volumes:
      - ./project/polpo.json:/app/workspace/.polpo/polpo.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      mock-llm:
        condition: service_healthy
    ports:
      - "${SELF_HOST_RUNTIME_PORT:-13890}:3890"
    networks: [polpo]

  dashboard:
    build:
      context: ../..
      dockerfile: apps/dashboard/Dockerfile
    environment:
      POLPO_API_URL: http://runtime:3890
      POLPO_API_KEY: polpo-e2e-secret
    depends_on:
      runtime:
        condition: service_healthy
    ports:
      - "${SELF_HOST_DASHBOARD_PORT:-13000}:3000"
    networks: [polpo]

volumes:
  postgres-data:

networks:
  polpo:
    driver: bridge
